# 관리 화면이나 GitHub 웹에서 projects.json · content.txt · 사진을 고치면
# 띠용 가벼운 이미지를 만들고 index.html 을 다시 만들어 저장소에 넣는다. 그 커밋이 Cloudflare Pages 로 배포된다.
name: 페이지 다시 만들기

on:
  push:
    branches: [main]
    paths:
      - projects.json
      - content.txt
      - template.html
      - build.mjs
      - parts/**
      - img/projects/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 띠용 이미지 만들기
        run: |
          npm install --no-save --no-package-lock sharp@0.33
          node scripts/optimize-images.mjs
      - name: index.html 만들기
        run: node build.mjs
      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img/projects/web
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "자동: 페이지 다시 만들기"
            git pull --rebase origin main
            git push
          fi
