<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* 레이아웃: 좌측 정렬 단일 컬럼. 왼쪽에 연도, 오른쪽에 사실. 선과 여백만으로 구분. */
:root{
  --bg:#f4ecdf; --fg:#1a1714; --muted:#6f675c; --line:#dcd1c0; --mark:#eadfce; --surface:#faf5ec; --refs:#e7e5e0;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191613; --fg:#efe8dc; --muted:#9a9186; --line:#35302a; --mark:#26221d; --surface:#211d19; --refs:#1e1e1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191613; --fg:#efe8dc; --muted:#9a9186; --line:#35302a; --mark:#26221d; --surface:#211d19; --refs:#1e1e1d; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.75;
  font-weight:400;padding-inline:24px;padding-block:0;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
a:hover{text-decoration-color:var(--fg)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.page{max-width:720px;margin:0 auto;padding-block:112px 96px;display:flex;flex-direction:column;gap:72px}
h1{font-size:clamp(34px,7vw,52px);font-weight:300;letter-spacing:-0.03em;line-height:1.2;margin:0}
.en{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em;margin-top:14px}
.contact{margin-top:40px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.mail{font-family:var(--mono);font-size:14px;user-select:all}
.social{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--muted)}
.group{display:flex;flex-direction:column}
.label{font-family:var(--sans);font-size:17px;font-weight:600;color:var(--fg);letter-spacing:-0.01em;line-height:1.4;margin:0 0 16px}
.item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 32px;border-top:1px solid var(--line);padding-block:28px}
.year{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.item > div{min-width:0}
h3{font-size:17px;font-weight:500;margin:0;letter-spacing:-0.01em}
.role{color:var(--muted);font-size:14px;margin:2px 0 0}
ul{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
p{margin:0}
.refs{margin-top:16px}
.refs summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);padding:4px 0}
.refs summary::-webkit-details-marker{display:none}
.refs summary::before{content:"+";display:inline-block;width:10px}
.refs[open] summary::before{content:"−"}
.refs summary:hover{color:var(--fg)}
.refs summary:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.cards{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;min-width:0}
.card:hover{border-color:var(--muted)}
.cmeta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.ctitle{font-size:14px;font-weight:500;line-height:1.5}
.cdesc{font-size:13px;color:var(--muted);line-height:1.6}
.talks{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.talk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:32px}
.talk .year{padding-top:0;line-height:1.9}
@media (max-width:560px){.talk{grid-template-columns:48px minmax(0,1fr);gap:16px}}
.todo{background:var(--mark);color:var(--muted);padding:1px 6px;border-radius:3px;font-size:13px}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;display:flex;flex-wrap:wrap;gap:4px 24px;font-variant-numeric:tabular-nums}
footer{align-items:center}
footer .mail{font-size:12px}
#visits{font-style:italic}
@media (max-width:560px){
  .page{padding-block:64px;gap:56px}
  .item{grid-template-columns:1fr;gap:6px}
}

h1{font-weight:500;letter-spacing:-0.035em}
/* 타일과 내용이 한 덩어리로 보이도록: 열린 타일과 패널이 같은 면 색을 쓰고 맞붙는다 */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;row-gap:8px}
.tile{appearance:none;font:inherit;color:var(--fg);background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px 16px;min-height:88px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;align-items:end;gap:6px 8px;text-align:left;cursor:pointer;transition:background .15s}
.tyear{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;align-self:start}
.tmark{font-family:var(--mono);font-size:14px;color:var(--muted);align-self:start;line-height:1.4}
.tmark::before{content:"+"}
.tile[aria-expanded="true"] .tmark::before{content:"−"}
.tname{grid-column:1/-1;font-size:clamp(17px,3.2vw,21px);font-weight:500;letter-spacing:-0.02em;line-height:1.25}
.tile:hover{background:var(--mark)}
.tile[aria-expanded="true"]{background:var(--surface);border-top:2px solid var(--fg);padding-top:11px;padding-bottom:24px;margin-bottom:-8px}
.tile:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.panel{grid-column:1/-1;background:var(--surface);padding:24px 20px 28px;min-width:0}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.prole{font-size:18px;font-weight:500;letter-spacing:-0.01em}
.plink{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reflabel{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);margin:28px 0 12px}
.panel ul{font-size:16px;gap:6px;margin-top:16px}
.panel ul li{padding-left:16px;position:relative}
.panel ul li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:1px;background:var(--fg)}
.panel .reflabel{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.panel .cards{gap:0 24px;margin-top:0}
.panel .card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;gap:3px}
.panel .card:hover .ctitle{text-decoration:underline;text-underline-offset:3px}
.panel .ctitle{font-size:13.5px;font-weight:400}
.panel .cdesc{font-size:12.5px}
.panel .cmeta{font-size:10.5px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:80px}.panel{padding:20px 16px 24px}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.social{gap:4px 14px;align-items:center}
.sns{display:inline-flex;padding:4px;margin:-4px;color:var(--fg);text-decoration:none}
.sns:hover{color:var(--muted)}
.ico{display:block;height:20px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.talks{border-top:1px solid var(--line);padding-top:16px;display:block;font-size:15px;line-height:1.9;max-width:38em}
.card span{overflow-wrap:anywhere}
.card [lang="ja"]{word-break:normal;line-break:strict}
.panel .refs-area{background:var(--refs);margin:32px -20px -28px;padding:20px 20px 24px}
.panel .refs-area .reflabel{margin:0 0 4px;padding-top:0;border-top:0}
@media (max-width:560px){.panel .refs-area{margin:28px -16px -24px;padding:18px 16px 20px}}
/* 글: 메인 최근 글, /blog 목록, 글 페이지 */
.posts{display:flex;flex-direction:column}
.post-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 32px;border-top:1px solid var(--line);padding-block:20px;text-decoration:none;color:var(--fg)}
.post-row[hidden]{display:none}
.post-row .year{padding-top:3px}
.post-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.post-title{font-size:17px;font-weight:500;letter-spacing:-0.01em;line-height:1.5}
.post-row:hover .post-title{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.post-sum{font-size:14px;color:var(--muted);line-height:1.65}
.post-cat{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.post-more{align-self:flex-start;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-decoration:none}
.post-more:hover{color:var(--fg)}
.post-empty{color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
.post-filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.post-filters button{appearance:none;font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:32px;cursor:pointer}
.post-filters button:hover{color:var(--fg);border-color:var(--muted)}
.post-filters button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.blog-page{gap:56px}
.blog-top{display:flex;align-items:baseline;gap:12px}
.blog-top a{font-size:22px;font-weight:500;letter-spacing:-0.03em;text-decoration:none}
.blog-top .en{margin-top:0}
.blog-h{font-size:17px}
.post{display:flex;flex-direction:column}
.post-meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 0 12px}
.post-h{font-size:clamp(26px,5vw,36px);font-weight:500;letter-spacing:-0.03em;line-height:1.3;margin:0 0 40px}
.prose{font-size:17px;line-height:1.9;overflow-wrap:anywhere}
.prose > *{margin:0 0 1.3em}
.prose h2{font-size:21px;font-weight:600;letter-spacing:-0.02em;line-height:1.4;margin:2.2em 0 .8em}
.prose h3{font-size:18px;font-weight:600;margin:1.8em 0 .6em}
.prose ul,.prose ol{list-style:revert;padding-left:1.4em;display:block}
.prose li{margin:.25em 0}
.prose blockquote{margin-inline:0;padding:2px 0 2px 20px;border-left:2px solid var(--fg);color:var(--fg);font-size:18px}
.prose blockquote p{margin:0 0 .6em}
.prose img{display:block;max-width:100%;height:auto;border-radius:6px;margin:2em 0}
.prose hr{border:0;border-top:1px solid var(--line);margin:2.5em 0}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--mark);padding:1px 5px;border-radius:3px}
.prose pre{background:var(--surface);padding:16px;border-radius:6px;overflow-x:auto}
.prose pre code{background:none;padding:0}
@media (max-width:560px){.post-row{grid-template-columns:1fr;gap:4px}.prose{font-size:16px}}
</style>
</head>

<script>
(function(){
  var bar=document.querySelector('.post-filters'); if(!bar) return;
  var rows=[].slice.call(document.querySelectorAll('.post-row'));
  bar.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(bar.children,function(x){x.classList.toggle('on',x===b)});
    var f=b.getAttribute('data-f');
    rows.forEach(function(r){r.hidden=!!f&&r.getAttribute('data-cat')!==f});
  });
})();
</script>
