<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="김종원">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="https://ben-kim.co/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{canonical}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{fonts}}
{{style}}
</head>
<body>
<div class="page blog-page">
  <header class="blog-top"><a href="/">김종원</a><span class="en">Ben Kim</span></header>

{{main}}

  <footer><span>2026</span><span class="mail">ben.kim8930@gmail.com</span></footer>
</div>
<script>
// 조회수: 글 페이지는 열릴 때마다 올리고, 목록은 한 번에 받아 온다
(function(){
  var fmt=function(n){return '조회 '+n.toLocaleString('ko-KR')};
  var meta=document.querySelector('.post-meta[data-slug]');
  if(meta){
    // 글이 열릴 때마다(새로고침·다시 들어오기 포함) 1씩 센다
    var s=meta.getAttribute('data-slug');
    fetch('/api/views?slug='+encodeURIComponent(s),{method:'POST',cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(!d||typeof d.count!=='number')return;var v=meta.querySelector('.views');v.textContent=fmt(d.count);v.hidden=false;
    }).catch(function(){});
  }
  var rows=[].slice.call(document.querySelectorAll('.post-row[data-slug]'));
  if(rows.length){
    var slugs=rows.map(function(r){return r.getAttribute('data-slug')});
    fetch('/api/views?slugs='+slugs.map(encodeURIComponent).join(',')).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(!d||!d.counts)return;
      rows.forEach(function(r){var n=d.counts[r.getAttribute('data-slug')];if(typeof n!=='number')return;var v=r.querySelector('.views');v.textContent=fmt(n);v.hidden=false});
    }).catch(function(){});
  }
})();
</script>
<script>
(function(){
  var bar=document.querySelector('.post-filters'); if(!bar) return;
  var rows=[].slice.call(document.querySelectorAll('.post-row'));
  bar.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(bar.children,function(x){x.classList.toggle('on',x===b)});
    var f=b.getAttribute('data-f');
    rows.forEach(function(r){r.hidden=!!f&&r.getAttribute('data-cat')!==f});
  });
})();
</script>
</body>
</html>
